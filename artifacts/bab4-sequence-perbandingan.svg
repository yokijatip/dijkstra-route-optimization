</text>
<path d="M745 1300 H425" fill="none" stroke="black" stroke-width="2" marker-end="url(#a)" stroke-dasharray="8 6"/>
<text stroke="white" stroke-width="5" paint-order="stroke" x="272.5" y="1383" text-anchor="middle" font-family="Times New Roman,Times,serif" font-size="23" font-weight="normal" fill="black">
